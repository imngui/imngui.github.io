user_description: I am a Computer Science Ph.D. student in the Parasol Lab at the University of Illinois Urbana-Champaign, advised by Prof. Nancy M. Amato. I build extended reality (XR) systems that let people specify and teach robot behavior by editing the robot's environment rather than the robot itself, and I develop the planning and learning methods behind them, from preference learning to scalable multi-robot motion planning. I received my B.S. in Computer Science, with a minor in Mathematics, from the University of Wisconsin–Milwaukee.
